<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <title>Pesquisa de todas as pessoas no sistema</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://dl.dropbox.com/scl/fi/r2a1ld2xtkxkdfc8dlsr5/tool.png?rlkey=schd5t3as8tzf71ld5dj07972&st=p6pfvznp&dl=0" type="image/jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Adicionando a biblioteca SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        /* Scrollbar para navegadores WebKit */
        ::-webkit-scrollbar {
          width: 32px;
        }

        ::-webkit-scrollbar-track {
          background: #eee;
          border-left:1px solid #111;
        }

        ::-webkit-scrollbar-thumb {
          background-color: #555;
        }

        ::-webkit-scrollbar-thumb:hover {
          background: #333;
        }

        /* Scrollbar para Firefox */
        body {
          scrollbar-width: thin;
          scrollbar-color: #555 #eee;
        }
        input[type="file"] { margin-bottom: 10px; }
        ul { list-style-type: none; padding-left: 0; }
        li { padding: 5px 0; border-bottom: 1px solid #ccc; }
        #upload {
            display: none; /* Esconde o input padrão */
        }

        .upload-label {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .upload-label:hover {
            background-color: #0056b3;
        }

        .search-input {
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 25px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            width: 100%;
            height: 40px; /* Garante que a altura seja fixa para alinhamento */
        }

        .search-input:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.4);
        }
        #department-filter {
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        #department-filter label {
            margin-left: 0;
            margin-right: 0;
        }
        .voltar-tela-inicial {
            display: flex;
            flex-direction: row;
            position: fixed;
            top: 0px;
            left: 0px;
            right:0;
            display: flex;
            flex-direction: row;
            gap: 10px;
            z-index: 999;
            flex-wrap: wrap; /* Para permitir quebra de linha */
            background:#222;
            padding:10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            justify-content: center;
        }

        /* Estilo base compartilhado entre os botões */
        .voltar-tela-inicial button {
            width: 50px;
            height: 50px;
            background: #eee;
            border: 2px solid #000;
            font-size: 24px;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            color: black;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
<div class="voltar-tela-inicial">
   <button onclick="window.location.href='https://armandodecampos.github.io/Ferramentas-Trabalho/'">
      <i class="fas fa-home"></i>
    </button>
</div>
<br>
<br>
<br>
<br>
    <h3>Pesquisa de todas as pessoas no sistema</h3>
    <input type="file" id="upload" accept=".xls,.xlsx" />
    <label for="upload" class="upload-label">Selecionar arquivo Excel</label>
    <p id="file-name" style="font-style: italic; color: #555;"></p>
    <br>
    <p id="count">Total de pessoas: 0</p>
    <div id="department-filter">
        <button id="toggle-filter-btn" style="padding: 10px 15px; font-size: 16px; border: none; border-radius: 5px; background-color: #555; color: white; cursor: pointer; display: flex; align-items: center; gap: 5px;">
            <i class="fas fa-filter"></i>
            Filtrar por Departamento
        </button>
        <div id="department-checkboxes-container" class="hidden">
            <label style="margin-bottom: 10px; cursor: pointer;">
                <input type="checkbox" id="toggle-all-checkboxes"> Marcar Todos/Desmarcar Todos
            </label>
        </div>
    </div>
    <br>
    <!-- Contêiner para o campo de pesquisa e o botão de limpar -->
    <div class="relative w-full max-w-lg flex items-center space-x-2">
        <input type="text" id="search" placeholder="🔍 Pesquisar..." class="search-input" />
        <button id="clear-search-btn" class="hidden px-4 py-2 rounded-full bg-red-500 hover:bg-red-600 text-white text-sm focus:outline-none transition-all duration-200">
            Apagar
        </button>
    </div>
    <ul id="list"></ul>
    <script>
        const uploadInput = document.getElementById('upload');
        const searchInput = document.getElementById('search');
        const clearSearchBtn = document.getElementById('clear-search-btn');
        const list = document.getElementById('list');
        let allItems = {};
        let departmentCheckboxes = {};

        // Função de normalização para remover acentos e converter para minúsculas
        function normalizeText(text) {
            return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        // Função de debounce para limitar a frequência de execução de uma função
        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }
        const departmentFilterDiv = document.getElementById('department-filter');
        const toggleAllCheckbox = document.getElementById('toggle-all-checkboxes');
        const toggleFilterBtn = document.getElementById('toggle-filter-btn');
        const checkboxesContainer = document.getElementById('department-checkboxes-container');

        // Função para carregar dados do cache ao iniciar a página
        function loadFromCache() {
            const cachedData = localStorage.getItem('excelData');
            if (cachedData) {
                try {
                    const parsedData = JSON.parse(cachedData);
                    allItems = parsedData.items;
                    const originalDepartments = parsedData.depts;
                    document.getElementById('file-name').textContent = 'Dados carregados do cache.';
                    
                    renderDepartmentFilters(originalDepartments);

                    const toggleAllCheckboxElement = document.getElementById('toggle-all-checkboxes');
                    if (toggleAllCheckboxElement && Object.keys(originalDepartments).length > 0) {
                        toggleAllCheckboxElement.checked = true;
                    }

                    filterAndRenderList();
                } catch (e) {
                    console.error("Erro ao carregar dados do cache:", e);
                    localStorage.removeItem('excelData');
                }
            }
        }

        // Função para salvar dados no cache
        function saveToCache() {
            const dataToCache = {
                items: allItems,
                depts: Object.values(departmentCheckboxes).reduce((acc, dept) => {
                    acc[dept] = dept;
                    return acc;
                }, {})
            };
            localStorage.setItem('excelData', JSON.stringify(dataToCache));
        }

        uploadInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            document.getElementById('file-name').textContent = `📂 Arquivo selecionado: ${file.name}`;
            if (!file) return;

            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            const sheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[sheetName];
            // Utiliza a função sheet_to_json com a opção 'raw' para obter valores brutos
            const json = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });

            const departments = {};
            const originalDepartments = {};

            // Mapeamento das colunas conforme o solicitado pelo usuário
            const columnMapping = {
                'ID': 0, // Coluna A (ID)
                'Nome': 1, // Coluna B
                'Sobrenome': 2, // Coluna C
                'Departamento': 4, // Coluna E
                'Celular': 7, // Coluna H
                'Email': 8, // Coluna I (agora Cartão)
                'Informado no Relatorio': 9 // Coluna J (agora Email)
            };

            // Itera sobre o array para pegar a linha correta
            json.forEach(row => {
                // Mapeia os dados conforme o novo mapeamento de colunas e substitui valores em branco por '-'
                const id = row[columnMapping['ID']] ? row[columnMapping['ID']].toString().trim() : "-";
                const nome = row[columnMapping['Nome']] ? row[columnMapping['Nome']].trim() : "-";
                const sobrenome = row[columnMapping['Sobrenome']] ? row[columnMapping['Sobrenome']].trim() : "-";
                const department = row[columnMapping['Departamento']] && row[columnMapping['Departamento']].trim() ? row[columnMapping['Departamento']].trim() : "Portaria Virtual";
                const celular = row[columnMapping['Celular']] ? row[columnMapping['Celular']].toString().trim() : "-";
                const cartao = row[columnMapping['Email']] ? row[columnMapping['Email']].toString().trim() : "-"; // O antigo email agora é "Cartão"
                const email = row[columnMapping['Informado no Relatorio']] ? row[columnMapping['Informado no Relatorio']].toString().trim() : "-"; // O antigo "Informado no Relatório" agora é "Email"
                

                // Valida se os dados essenciais existem
                if (!id || !nome || !sobrenome || !department) return;

                if (!departments[department]) {
                    departments[department] = new Set();
                    originalDepartments[department] = department;
                }
                
                // Cria um elemento HTML para cada item com ícones e os novos cabeçalhos
                const itemHtml = `
                    <div class="flex flex-wrap space-x-4">
                        <span class="flex items-center space-x-1">
                            <i class="fas fa-user text-blue-500"></i>
                            <span>${nome} ${sobrenome}</span>
                        </span>
                        <span class="flex items-center space-x-1">
                            <i class="fas fa-id-badge text-gray-500"></i>
                            <span>CPF (ID): ${id}</span>
                        </span>
                        ${email !== "-" ? `
                        <span class="flex items-center space-x-1">
                            <i class="fas fa-envelope text-red-500"></i>
                            <span>Email: ${email}</span>
                        </span>` : ''}
                        ${celular !== "-" ? `
                        <span class="flex items-center space-x-1">
                            <i class="fas fa-phone text-purple-500"></i>
                            <span>Celular: ${celular}</span>
                        </span>` : ''}
                        ${cartao !== "-" ? `
                        <span class="flex items-center space-x-1">
                            <i class="fas fa-address-card text-green-500"></i>
                            <span>Cartão: ${cartao}</span>
                        </span>` : ''}
                    </div>
                `;

                // Pre-calcula o texto de pesquisa para melhorar a performance
                const searchText = normalizeText(`${nome} ${sobrenome} ${id} ${email} ${celular} ${cartao}`);

                departments[department].add(JSON.stringify({ html: itemHtml, searchText: searchText }));
            });

            const departmentsArray = {};
            for (const dept in departments) {
                departmentsArray[dept] = Array.from(departments[dept]).map(item => JSON.parse(item));
            }

            allItems = departmentsArray;
            renderDepartmentFilters(originalDepartments);
            
            // Salva os dados no cache após o upload
            saveToCache();

            const toggleAllCheckboxElement = document.getElementById('toggle-all-checkboxes');
            if (toggleAllCheckboxElement && Object.keys(originalDepartments).length > 0) {
                toggleAllCheckboxElement.checked = true;
            }

            filterAndRenderList();
        });

        const debouncedFilter = debounce(filterAndRenderList, 300);

        searchInput.addEventListener('input', () => {
            if (searchInput.value.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            debouncedFilter();
        });

        // Adiciona um evento de clique para o novo botão de limpar
        clearSearchBtn.addEventListener('click', () => {
            searchInput.value = ''; // Limpa o valor do input
            clearSearchBtn.classList.add('hidden'); // Esconde o botão novamente
            filterAndRenderList(); // Atualiza a lista para mostrar todos os resultados
        });


        function renderGroupedList(groups) {
            const fragment = document.createDocumentFragment();
            let total = 0;

            Object.keys(groups).sort().forEach(dept => {
                const deptHeader = document.createElement('li');
                deptHeader.innerHTML = `<strong>${dept}</strong>`;
                deptHeader.style.marginTop = '15px';
                fragment.appendChild(deptHeader);

                groups[dept].forEach(item => {
                    const li = document.createElement('li');
                    // Se item for uma string (dados antigos no cache), usa diretamente
                    // Caso contrário, usa a propriedade html
                    li.innerHTML = typeof item === 'string' ? item : item.html;
                    fragment.appendChild(li);
                    total++;
                });
            });

            list.innerHTML = '';
            list.appendChild(fragment);
            document.getElementById('count').textContent = `Total de pessoas: ${total}`;
        }

        function renderDepartmentFilters(depts) {
            // Limpa o conteúdo da div de checkboxes antes de adicionar os novos
            checkboxesContainer.innerHTML = '';

            const toggleAllLabel = document.createElement('label');
            const toggleCheckbox = document.createElement('input');
            toggleCheckbox.type = 'checkbox';
            toggleCheckbox.id = 'toggle-all-checkboxes';
            toggleAllLabel.appendChild(toggleCheckbox);
            toggleAllLabel.appendChild(document.createTextNode(' Marcar Todos/Desmarcar Todos'));
            toggleAllLabel.style.marginBottom = '10px';
            toggleAllLabel.style.cursor = 'pointer';
            checkboxesContainer.appendChild(toggleAllLabel);

            toggleCheckbox.addEventListener('change', toggleAllDepartments);

            departmentCheckboxes = {};

            Object.keys(depts).sort().forEach(dept => {
                const count = allItems[dept] ? allItems[dept].length : 0;
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = `dept-${dept.replace(/\s+/g, '-')}`;
                checkbox.value = dept;
                checkbox.checked = true;
                checkbox.addEventListener('change', filterAndRenderList);

                const label = document.createElement('label');
                label.htmlFor = checkbox.id;
                label.textContent = `${dept} (${count})`;
                label.style.marginLeft = '0px';
                label.style.marginRight = '0px';

                const div = document.createElement('div');
                div.appendChild(checkbox);
                div.appendChild(label);
                checkboxesContainer.appendChild(div);
                departmentCheckboxes[checkbox.id] = dept;
            });
        }

        function toggleAllDepartments() {
            const shouldCheck = this.checked;
            Object.keys(departmentCheckboxes).forEach(checkboxId => {
                const checkbox = document.getElementById(checkboxId);
                if (checkbox) {
                    checkbox.checked = shouldCheck;
                }
            });
            filterAndRenderList();
        }

        function filterAndRenderList() {
            const search = normalizeText(searchInput.value);
            const searchWords = search.split(/\s+/).filter(Boolean);
            const visibleDepartments = new Set();

            Object.keys(departmentCheckboxes).forEach(checkboxId => {
                const checkbox = document.getElementById(checkboxId);
                if (checkbox && checkbox.checked) {
                    visibleDepartments.add(departmentCheckboxes[checkboxId]);
                }
            });

            const filteredGroups = {};

            Object.keys(allItems).forEach(dept => {
                if (visibleDepartments.has(dept)) {
                    const filtered = allItems[dept].filter(item => {
                        // Se item for uma string (dados antigos no cache), normaliza na hora
                        // Caso contrário, usa o searchText pré-calculado para melhor performance
                        const itemSearchableText = typeof item === 'string' ? normalizeText(item) : item.searchText;
                        return searchWords.every(word => itemSearchableText.includes(word));
                    });

                    if (filtered.length > 0) {
                        filteredGroups[dept] = filtered;
                    }
                }
            });

            renderGroupedList(filteredGroups);
        }
        // Evento para o botão de abrir/fechar os filtros
        toggleFilterBtn.addEventListener('click', () => {
            checkboxesContainer.classList.toggle('hidden');
        });
        
        // Carrega os dados do cache ao iniciar a página
        loadFromCache();
    </script>
</body>
</html>
